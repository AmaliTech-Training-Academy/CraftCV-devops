# nginx for the CraftCV sandbox.
#
# One origin serves both halves:
#
#   /        the generated Nuxt site, as static files
#   /api/    Django, proxied to the app container on 127.0.0.1:8000
#   /admin/  Django admin, same proxy
#
# That single-origin arrangement is the point. The browser only ever calls
# the host it loaded the page from, so no server address is baked into the
# frontend bundle - which matters because this sandbox stops overnight and
# returns on a different public IP. It also means no CORS configuration is
# needed for the two halves to talk.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    # --- Frontend -----------------------------------------------------------
    root /var/www/craftcv;
    index index.html;

    location / {
        # Fall back to index.html so client-side routes survive a refresh.
        try_files $uri $uri/ /index.html;
    }

    # Nuxt fingerprints these filenames, so they can be cached hard.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Backend ------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files, which the admin needs to render.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
